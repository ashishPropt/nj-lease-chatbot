<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDF Form Chatbot - Test Interface</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 0; }
  .container { max-width: 700px; margin: 30px auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; min-height: 90vh; }
  header { padding: 16px; border-bottom: 1px solid #ddd; }
  header h1 { margin: 0; font-size: 18px; }
  .progress { font-size: 12px; color: #666; margin-top: 4px; }
  #upload { padding: 24px; text-align: center; }
  #upload input { margin-bottom: 12px; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; }
  .msg { margin-bottom: 14px; padding: 10px 14px; border-radius: 8px; max-width: 85%; white-space: pre-wrap; line-height: 1.4; }
  .bot { background: #e8f0fe; align-self: flex-start; }
  .user { background: #d1f5d3; align-self: flex-end; text-align: right; }
  .msg-heading  { font-size: 12px; font-weight: bold; color: #1a56a0; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .msg-context  { font-size: 13px; color: #444; font-style: italic; margin-bottom: 8px; white-space: pre-wrap; border-left: 3px solid #c5d8f8; padding-left: 8px; }
  .msg-question { font-size: 14px; font-weight: 600; color: #111; white-space: pre-wrap; }
  form#form { display: flex; padding: 12px; border-top: 1px solid #ddd; }
  input[type=text] { flex: 1; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
  button { margin-left: 8px; padding: 10px 16px; font-size: 14px; border: none; background: #1a73e8; color: white; border-radius: 4px; cursor: pointer; }
  button:disabled { background: #aaa; }
  #download-link { display: none; margin: 12px; text-align: center; }
  #download-link a { display: inline-block; padding: 10px 20px; background: #34a853; color: white; text-decoration: none; border-radius: 4px; }
  .session-id { font-size: 11px; color: #999; margin-top: 4px; word-break: break-all; }
  #summary { padding: 12px 16px; }
  #summary table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #summary th, #summary td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; vertical-align: top; }
  #summary th { background: #f0f2f5; width: 30%; }
  #summary input { width: 100%; box-sizing: border-box; padding: 4px; font-size: 13px; border: 1px solid #ccc; border-radius: 3px; }
  #summary .save-btn { font-size: 11px; padding: 3px 8px; margin-left: 4px; }
  #confirm-btn { display: block; margin: 12px auto; padding: 10px 24px; font-size: 14px; border: none; background: #34a853; color: white; border-radius: 4px; cursor: pointer; }
  .error { color: #c00; margin-top: 8px; }
  .tabs { display: flex; border-bottom: 2px solid #ddd; }
  .tab { padding: 10px 20px; cursor: pointer; font-size: 14px; color: #555; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 600; }
  #parse-panel { padding: 20px; }
  #parse-panel label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; }
  #parse-panel input { margin-bottom: 12px; }
  #parse-result { margin-top: 16px; }
  #parse-result table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #parse-result th, #parse-result td { border: 1px solid #ddd; padding: 7px 10px; text-align: left; vertical-align: top; }
  #parse-result th { background: #f0f2f5; width: 40%; }
  #parse-result .heading-row td { background: #e8f0fe; font-weight: bold; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  #parse-result .no-answer { color: #999; font-style: italic; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>PDF Form Chatbot</h1>
    <div class="progress" id="progress"></div>
    <div class="session-id" id="session-id"></div>
  </header>

  <div class="tabs">
    <div class="tab active" id="tab-fill" onclick="switchTab('fill')">Fill a Form</div>
    <div class="tab" id="tab-parse" onclick="switchTab('parse')">Read a Filled Form</div>
  </div>

  <div id="upload">
    <p>Upload a PDF form. The chatbot will ask one question per blank/field, then return the form filled in.</p>
    <input type="file" id="file" accept="application/pdf" />
    <br>
    <button id="upload-btn">Upload &amp; Start</button>
    <div class="error" id="upload-error"></div>
  </div>

  <div id="parse-panel" style="display:none">
    <p>Upload a filled PDF to extract what was answered. Optionally provide the original blank form for better accuracy.</p>
    <label>Filled PDF (required):</label>
    <input type="file" id="filled-file" accept="application/pdf" /><br>
    <label>Original blank form (optional — improves matching):</label>
    <input type="file" id="original-file" accept="application/pdf" /><br>
    <button id="parse-btn">Extract Answers</button>
    <div class="error" id="parse-error"></div>
    <div id="parse-result"></div>
  </div>

  <div id="chat" style="display:none"></div>
  <div id="summary" style="display:none"></div>
  <div id="download-link"><a id="download-anchor" download>Download Filled PDF</a></div>
  <form id="form" style="display:none">
    <input type="text" id="answer" autocomplete="off" placeholder="Type your answer..." />
    <button type="submit">Send</button>
  </form>
</div>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('answer');
const progress = document.getElementById('progress');
const downloadLink = document.getElementById('download-link');
const downloadAnchor = document.getElementById('download-anchor');
const sessionIdEl = document.getElementById('session-id');
const summaryEl = document.getElementById('summary');
const uploadDiv = document.getElementById('upload');
const uploadBtn = document.getElementById('upload-btn');
const uploadError = document.getElementById('upload-error');
const fileInput = document.getElementById('file');

let sessionId = null;

function addMsg(data, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;

  if (who === 'bot' && data && typeof data === 'object') {
    // Section heading
    if (data.heading) {
      const h = document.createElement('div');
      h.className = 'msg-heading';
      h.textContent = data.heading;
      div.appendChild(h);
    }
    // Context clause (the full line from the form, with ____ shown)
    if (data.context) {
      const c = document.createElement('div');
      c.className = 'msg-context';
      c.textContent = data.context;
      div.appendChild(c);
    }
    // Short question
    const q = document.createElement('div');
    q.className = 'msg-question';
    q.textContent = data.question + (data.suggestedAnswer ? `\n\n(Suggested: ${data.suggestedAnswer} — press Enter or type "yes" to accept)` : '');
    div.appendChild(q);
  } else {
    // Plain text (user messages, system messages)
    const content = document.createElement('div');
    content.textContent = typeof data === 'string' ? data : (data.message || '');
    div.appendChild(content);
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function renderSummary(summary) {
  summaryEl.style.display = 'block';
  summaryEl.innerHTML = '';
  const table = document.createElement('table');
  summary.forEach((item) => {
    const tr = document.createElement('tr');

    const th = document.createElement('th');
    th.textContent = item.section ? (item.section + ' — ' + item.question) : item.question;
    tr.appendChild(th);

    const td = document.createElement('td');
    const valInput = document.createElement('input');
    valInput.type = 'text';
    valInput.value = item.answer;
    td.appendChild(valInput);

    const saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.className = 'save-btn';
    saveBtn.textContent = 'Update';
    saveBtn.addEventListener('click', async () => {
      const res = await fetch('/api/sessions/' + sessionId + '/confirm', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({fieldId: item.fieldId, answer: valInput.value})
      });
      handleResponse(await res.json());
    });
    td.appendChild(saveBtn);

    tr.appendChild(td);
    table.appendChild(tr);
  });
  summaryEl.appendChild(table);

  const confirmBtn = document.createElement('button');
  confirmBtn.id = 'confirm-btn';
  confirmBtn.textContent = 'Confirm and generate PDF';
  confirmBtn.addEventListener('click', async () => {
    const res = await fetch('/api/sessions/' + sessionId + '/confirm', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({confirm: true})
    });
    handleResponse(await res.json());
  });
  summaryEl.appendChild(confirmBtn);
}

function handleResponse(data) {
  sessionId = data.sessionId;
  sessionIdEl.textContent = 'Session: ' + sessionId;

  if (data.needsConfirmation) {
    if (!chat.dataset.reviewShown) {
      addMsg(data.message, 'bot');
      chat.dataset.reviewShown = '1';
    }
    progress.textContent = 'Review your answers';
    input.style.display = 'none';
    form.querySelector('button').style.display = 'none';
    renderSummary(data.summary);
    return;
  }

  if (data.done) {
    summaryEl.style.display = 'none';
    addMsg(data.message, 'bot');
    progress.textContent = 'Complete!';
    downloadAnchor.href = '/api/sessions/' + sessionId + '/pdf';
    downloadLink.style.display = 'block';
    input.disabled = true;
    form.querySelector('button').disabled = true;
  } else {
    // Pass the full data object so addMsg can render heading/context/question separately
    addMsg(data, 'bot');
    progress.textContent = 'Question ' + data.progress.current + ' of ' + data.progress.total;
    if (data.suggestedAnswer) {
      input.value = data.suggestedAnswer;
      input.select();
    } else {
      input.value = '';
    }
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const val = input.value.trim();
  if (!val) return;
  addMsg(val, 'user');
  input.value = '';
  const res = await fetch('/api/sessions/' + sessionId + '/answer', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({answer: val})
  });
  handleResponse(await res.json());
});

uploadBtn.addEventListener('click', async () => {
  uploadError.textContent = '';
  const file = fileInput.files[0];
  if (!file) { uploadError.textContent = 'Please choose a PDF file.'; return; }

  uploadBtn.disabled = true;
  uploadBtn.textContent = 'Analyzing...';
  try {
    const fd = new FormData();
    fd.append('file', file);
    const uploadRes = await fetch('/api/forms', { method: 'POST', body: fd });
    const uploadData = await uploadRes.json();
    if (!uploadRes.ok) throw new Error(uploadData.error || 'Upload failed');

    const sessRes = await fetch('/api/forms/' + uploadData.formId + '/sessions', { method: 'POST' });
    const sessData = await sessRes.json();
    if (!sessRes.ok) throw new Error(sessData.error || 'Failed to start session');

    uploadDiv.style.display = 'none';
    chat.style.display = 'flex';
    form.style.display = 'flex';
    handleResponse(sessData);
  } catch (err) {
    uploadError.textContent = err.message;
    uploadBtn.disabled = false;
    uploadBtn.textContent = 'Upload & Start';
  }
});

// ── Tab switching ─────────────────────────────────────────────────────────────
const parsePanel = document.getElementById('parse-panel');

function switchTab(tab) {
  document.getElementById('tab-fill').classList.toggle('active', tab === 'fill');
  document.getElementById('tab-parse').classList.toggle('active', tab === 'parse');
  uploadDiv.style.display  = tab === 'fill'  ? '' : 'none';
  parsePanel.style.display = tab === 'parse' ? '' : 'none';
  // hide chatbot panels when switching away
  if (tab === 'parse') {
    chat.style.display = 'none';
    form.style.display = 'none';
    document.getElementById('summary').style.display = 'none';
    document.getElementById('download-link').style.display = 'none';
  }
}

// ── Parse filled PDF ──────────────────────────────────────────────────────────
document.getElementById('parse-btn').addEventListener('click', async () => {
  const parseError  = document.getElementById('parse-error');
  const parseResult = document.getElementById('parse-result');
  const filledFile   = document.getElementById('filled-file').files[0];
  const originalFile = document.getElementById('original-file').files[0];
  parseError.textContent = '';
  parseResult.innerHTML  = '';

  if (!filledFile) { parseError.textContent = 'Please choose the filled PDF.'; return; }

  const btn = document.getElementById('parse-btn');
  btn.disabled = true;
  btn.textContent = 'Extracting…';

  try {
    const fd = new FormData();
    fd.append('filled', filledFile);
    if (originalFile) fd.append('original', originalFile);

    const res  = await fetch('/api/parse-filled', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Extraction failed');
    if (data.error) throw new Error(data.error);

    renderParseResult(data);
  } catch (err) {
    parseError.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Extract Answers';
  }
});

function renderParseResult(data) {
  const container = document.getElementById('parse-result');
  const fields = data.fields || [];
  if (!fields.length) {
    container.innerHTML = '<p style="color:#999">No filled values could be detected.</p>';
    return;
  }

  const table = document.createElement('table');
  let lastHeading = '';

  fields.forEach((f) => {
    // Insert a heading row when the section changes
    if (f.heading && f.heading !== lastHeading) {
      lastHeading = f.heading;
      const hRow = document.createElement('tr');
      hRow.className = 'heading-row';
      const hCell = document.createElement('td');
      hCell.colSpan = 2;
      hCell.textContent = f.heading;
      hRow.appendChild(hCell);
      table.appendChild(hRow);
    }

    const tr = document.createElement('tr');

    const th = document.createElement('th');
    th.innerHTML = f.context
      ? `<span style="font-size:11px;color:#555">${escHtml(f.context)}</span><br>${escHtml(f.question)}`
      : escHtml(f.question || f.context || '—');
    tr.appendChild(th);

    const td = document.createElement('td');
    td.textContent = f.answer || '';
    if (!f.answer) td.className = 'no-answer';
    tr.appendChild(td);

    table.appendChild(tr);
  });

  const modeTag = document.createElement('p');
  modeTag.style.cssText = 'font-size:11px;color:#999;margin-bottom:8px';
  modeTag.textContent = `Detection mode: ${data.mode}`;

  container.appendChild(modeTag);
  container.appendChild(table);
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
